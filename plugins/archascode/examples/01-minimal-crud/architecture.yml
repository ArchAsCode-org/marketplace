schema_version: "3.0"
metadata:
  name: customer-only
  description: Single-entity CRUD tracer
  version: 0.1.0
domain:
  entities:
    Customer:
      attributes:
        id:
          type: UUID
          identity: true
          generated: true
        name:
          type: str
          required: true
        email:
          type: str
          required: true
          unique: true
        created_at:
          type: datetime
          generated: true
        updated_at:
          type: datetime
          generated: true
api:
  base_path: ""
